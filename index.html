<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Traffic Dodger</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; color: #f2f4ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { min-height: 100vh; min-height: 100dvh; padding-top: max(12px, env(safe-area-inset-top)); padding-right: max(12px, env(safe-area-inset-right)); padding-bottom: max(12px, env(safe-area-inset-bottom)); padding-left: max(12px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 0%, #25214d 0%, #0d0e1c 60%, #07080f 100%); display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
  .wrap { width: 100%; max-width: 340px; }
  .brand { text-align: center; font-size: 13px; font-weight: 800; font-style: italic; letter-spacing: 4px; margin: 2px 0 10px; background: linear-gradient(90deg, #00e5ff, #ff2fd1); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud { display: flex; gap: 8px; margin: 0 0 10px; }
  .card { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 6px 10px; }
  .card small { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #8d93b5; }
  .card b { font-size: 20px; font-weight: 700; }
  #sc { color: #7ff0ff; } #co { color: #ffd36b; } #bs { color: #ff8be8; }
  canvas { display: block; width: 100%; border-radius: 16px; touch-action: none; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 12px 40px rgba(0,229,255,0.15); }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  button { height: 58px; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; font-family: inherit; color: #f2f4ff; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16); border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  button:active { transform: scale(0.96); }
  .s { flex: 1; font-size: 22px; }
  .w { flex: 2; }
  #bk { color: #ffa39c; background: linear-gradient(180deg, rgba(255,59,48,0.28), rgba(255,59,48,0.08)); border-color: rgba(255,99,90,0.6); box-shadow: 0 0 14px rgba(255,59,48,0.2); }
  #bb { color: #8be9ff; background: linear-gradient(180deg, rgba(0,229,255,0.28), rgba(0,229,255,0.08)); border-color: rgba(0,229,255,0.6); box-shadow: 0 0 14px rgba(0,229,255,0.2); }
</style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">TRAFFIC DODGER</div>
  <div class="hud">
    <div class="card"><small>Score</small><b id="sc">0</b></div>
    <div class="card"><small>Coins</small><b id="co">0</b></div>
    <div class="card"><small>Best</small><b id="bs">0</b></div>
  </div>
  <canvas id="g" width="340" height="460"></canvas>
  <div class="controls">
    <button id="bl" class="s" aria-label="Move left">&larr;</button>
    <button id="bk" class="w">BRAKE</button>
    <button id="bb" class="w">BOOST <span id="bn">(1)</span></button>
    <button id="br" class="s" aria-label="Move right">&rarr;</button>
  </div>
</div>
<script>
// Telegram Mini App integration is optional: the game still works in a normal browser.
(function(){
var c=document.getElementById('g'),x=c.getContext('2d');
var W=340,H=460,L=3,LW=W/L,CW=40,CH=70,BD=2.5,BM=1.8,BRK=0.45,CF=0.62,LS=350;
var dpr=Math.min(2,window.devicePixelRatio||1);
c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  function tgHaptic(kind) {
    try {
      if (tg && tg.HapticFeedback) {
        if (kind === 'impact') tg.HapticFeedback.impactOccurred('light');
        else if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (kind === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.selectionChanged();
      }
    } catch (e) {}
  }
  try {
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0d0e1c');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0d0e1c');
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }
  } catch (e) {}
  var savedBest = 0;
  try { savedBest = Number(localStorage.getItem('trafficDodgerBest') || 0) || 0; } catch (e) {}
  var st='ready',p,cars,coins,pups,parts=[],speed,score,cn,best=savedBest,spawnD,sl,off,last,bc,bT,msg=0,brk=false,brkPtr=null,lvl=1,lvT=0,shake=0,flash=0,crashT=0,clock=0,curEff=230;
var scoreSubmitted=false;
async function submitFinalScore(){
  if(scoreSubmitted) return;
  scoreSubmitted=true;
  if(!tg || !tg.initData){ console.warn('Score not submitted: open the game inside Telegram.'); return; }
  try {
    var response=await fetch('https://traffic-dodge-bot.onrender.com/api/score',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData},body:JSON.stringify({score:Math.floor(score),coins:Math.floor(cn)})});
    var result=await response.json();
    if(!response.ok) throw new Error(result.detail || ('HTTP '+response.status));
    console.log('Score saved:',result);
  } catch(err) { console.error('Could not save score to leaderboard:',err); scoreSubmitted=false; }
}
var cols=['#E24B4A','#EF9F27','#8B7CF6','#1FB58A','#E0508C','#3C8DE8','#F2C94C'];
var specks=[];for(var si=0;si<70;si++)specks.push({x:10+Math.random()*(W-20),y:Math.random()*H,r:Math.random()*1.2+0.4,a:Math.random()*0.12+0.04});
var vig=x.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.78);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,10,0.62)');
var vigB=x.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.7);vigB.addColorStop(0,'rgba(0,160,255,0)');vigB.addColorStop(1,'rgba(0,190,255,0.5)');
function lx(l){return l*LW+LW/2}
function dif(){return Math.min(lvl-1,9)/9}
function shade(h,a){var n=parseInt(h.slice(1),16),r=(n>>16)+a,g=((n>>8)&255)+a,b=(n&255)+a;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return 'rgb('+r+','+g+','+b+')'}
function reset(){scoreSubmitted=false;p={l:1,x:lx(1)};cars=[];coins=[];pups=[];parts=[];speed=230;curEff=230;score=0;cn=0;spawnD=0;sl=1;off=0;bc=1;bT=0;msg=0;brk=false;brkPtr=null;lvl=1;lvT=0;shake=0;flash=0;upd()}
function upd(){document.getElementById('sc').textContent=Math.floor(score);document.getElementById('co').textContent=cn;document.getElementById('bs').textContent=Math.floor(best);document.getElementById('bn').textContent='('+bc+')'}
function burst(px,py,cs,n,sp,life){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=sp*(0.3+Math.random());parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*(0.6+Math.random()*0.6),m:life,c:cs[Math.floor(Math.random()*cs.length)],s:1.5+Math.random()*2.5})}}
function upParts(dt){for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.98;q.vy*=0.98;q.l-=dt;if(q.l<=0)parts.splice(i,1)}}
function lamp(cx,cy){x.beginPath();x.ellipse(cx,cy,4,2.2,0,0,7);x.fill()}
function car(cx,cy,col,pl){
  var t=cy-CH/2,b=cy+CH/2,l=cx-CW/2,r=cx+CW/2;
  if(pl){
    var g0=x.createLinearGradient(0,t,0,t-150);g0.addColorStop(0,'rgba(255,245,200,0.3)');g0.addColorStop(1,'rgba(255,245,200,0)');
    x.fillStyle=g0;x.beginPath();x.moveTo(cx-12,t);x.lineTo(cx+12,t);x.lineTo(cx+36,t-150);x.lineTo(cx-36,t-150);x.closePath();x.fill();
    if(bT>0){
      var fl=42+Math.random()*20,gf=x.createLinearGradient(0,b,0,b+fl);gf.addColorStop(0,'#ffffff');gf.addColorStop(0.3,'#7fd8ff');gf.addColorStop(1,'rgba(0,120,255,0)');
      x.save();x.shadowColor='#00c8ff';x.shadowBlur=18;x.fillStyle=gf;
      x.beginPath();x.moveTo(cx-15,b-2);x.lineTo(cx-9,b+fl);x.lineTo(cx-3,b-2);x.closePath();x.fill();
      x.beginPath();x.moveTo(cx+3,b-2);x.lineTo(cx+9,b+fl);x.lineTo(cx+15,b-2);x.closePath();x.fill();x.restore()
    }
    x.save();x.shadowColor='#00e5ff';x.shadowBlur=bT>0?34:20;x.fillStyle='rgba(0,229,255,0.35)';x.beginPath();x.roundRect(l,t,CW,CH,11);x.fill();x.restore()
  }
  x.save();x.shadowColor='rgba(0,0,0,0.65)';x.shadowBlur=14;x.shadowOffsetY=6;x.fillStyle='#000';x.beginPath();x.roundRect(l,t+4,CW,CH-8,10);x.fill();x.restore();
  x.fillStyle='#07070a';x.beginPath();x.roundRect(l-3,t+9,6,16,2);x.roundRect(r-3,t+9,6,16,2);x.roundRect(l-3,b-25,6,16,2);x.roundRect(r-3,b-25,6,16,2);x.fill();
  var g2=x.createLinearGradient(l,0,r,0);g2.addColorStop(0,shade(col,-50));g2.addColorStop(0.3,shade(col,40));g2.addColorStop(0.55,col);g2.addColorStop(1,shade(col,-60));
  x.fillStyle=g2;x.beginPath();x.roundRect(l,t,CW,CH,11);x.fill();
  x.fillStyle='rgba(255,255,255,0.16)';x.beginPath();x.roundRect(l+7,t+3,CW-14,12,5);x.fill();
  var gg=x.createLinearGradient(0,t+14,0,t+30);gg.addColorStop(0,'#d4edff');gg.addColorStop(1,'#26364f');
  x.fillStyle=gg;x.beginPath();x.moveTo(l+6,t+30);x.lineTo(l+9,t+15);x.lineTo(r-9,t+15);x.lineTo(r-6,t+30);x.closePath();x.fill();
  x.fillStyle=shade(col,-28);x.beginPath();x.roundRect(l+6,t+30,CW-12,15,3);x.fill();
  x.fillStyle='#1c2a40';x.beginPath();x.moveTo(l+6,t+45);x.lineTo(r-6,t+45);x.lineTo(r-9,t+55);x.lineTo(l+9,t+55);x.closePath();x.fill();
  if(pl){x.fillStyle='rgba(255,255,255,0.6)';x.fillRect(cx-2,t+2,4,13);x.fillRect(cx-2,b-14,4,12)}
  x.fillStyle=shade(col,-45);x.fillRect(l-3,t+20,3,5);x.fillRect(r,t+20,3,5);
  x.save();x.shadowColor='#fff3a0';x.shadowBlur=10;x.fillStyle='#fffbd6';lamp(l+9,t+4);lamp(r-9,t+4);x.restore();
  var br=pl&&brk&&bT<=0;
  x.save();x.shadowColor='#ff2020';x.shadowBlur=br?24:8;x.fillStyle=br?'#ff7468':'#d81f1f';x.beginPath();x.roundRect(l+3,b-5,11,4,2);x.roundRect(r-14,b-5,11,4,2);x.fill();x.restore()
}
function bolt(cx,cy,s,col){
  x.fillStyle=col;x.beginPath();
  x.moveTo(cx+2*s,cy-9*s);x.lineTo(cx-5*s,cy+1*s);x.lineTo(cx-0.5*s,cy+1*s);x.lineTo(cx-2*s,cy+9*s);x.lineTo(cx+5*s,cy-2*s);x.lineTo(cx+0.5*s,cy-2*s);x.closePath();x.fill()
}
function coinD(k){
  var sx=Math.abs(Math.cos(clock*5+k.y*0.03)),px=lx(k.l);
  x.save();x.shadowColor='#ffcf40';x.shadowBlur=14;
  var g=x.createRadialGradient(px-3,k.y-3,1,px,k.y,12);g.addColorStop(0,'#fff6bf');g.addColorStop(0.5,'#ffc83a');g.addColorStop(1,'#c98700');
  x.fillStyle=g;x.beginPath();x.ellipse(px,k.y,Math.max(1.5,12*sx),12,0,0,7);x.fill();
  x.shadowBlur=0;x.strokeStyle='rgba(255,255,255,0.55)';x.lineWidth=1.5;x.beginPath();x.ellipse(px,k.y,Math.max(1,7*sx),7,0,0,7);x.stroke();x.restore()
}
function pupD(u){
  var px=lx(u.l),r=16+Math.sin(clock*6)*2;
  x.save();x.shadowColor='#00e5ff';x.shadowBlur=22;
  var g=x.createRadialGradient(px,u.y,2,px,u.y,r);g.addColorStop(0,'#3a97ff');g.addColorStop(1,'#0a2f7a');
  x.fillStyle=g;x.beginPath();x.arc(px,u.y,r,0,7);x.fill();x.strokeStyle='#7ff0ff';x.lineWidth=2;x.stroke();x.restore();
  bolt(px,u.y,1.1,'#ffe066')
}
function go(d){if(st!=='play')return;p.l=Math.max(0,Math.min(L-1,p.l+d))}
function start(){if(st==='crash')return;reset();st='play';last=performance.now()}
function boost(){
  if(st!=='play'){start();return}
  if(bT>0)return;
  if(bc>0){bc--;bT=BD;upd()}else{msg=1.2}
}
function press(d){if(st!=='play'){start();return}go(d)}
function tap(id,fn){
  var el=document.getElementById(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();fn()});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
  el.addEventListener('click',function(e){e.preventDefault()})
}
tap('bl',function(){press(-1)});
tap('br',function(){press(1)});
tap('bb',boost);
var bk=document.getElementById('bk');
bk.addEventListener('pointerdown',function(e){e.preventDefault();brk=true;brkPtr=e.pointerId});
function bOff(e){if(e.pointerId===brkPtr){brk=false;brkPtr=null}}
bk.addEventListener('pointerup',bOff);
bk.addEventListener('pointercancel',bOff);
bk.addEventListener('lostpointercapture',bOff);
bk.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('pointerup',bOff);
document.addEventListener('pointercancel',bOff);
c.addEventListener('pointerdown',function(e){
  e.preventDefault();
  if(st!=='play'){start();return}
  var r=c.getBoundingClientRect();go((e.clientX-r.left)<r.width/2?-1:1)
});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='a'){press(-1);e.preventDefault()}
  else if(e.key==='ArrowRight'||e.key==='d'){press(1);e.preventDefault()}
  else if(e.key==='ArrowUp'||e.key==='b'){boost();e.preventDefault()}
  else if(e.key==='ArrowDown'||e.key==='s'){brk=true;e.preventDefault()}
  else if((e.key===' '||e.key==='Enter')&&st!=='play'){start();e.preventDefault()}
});
window.addEventListener('keyup',function(e){if(e.key==='ArrowDown'||e.key==='s')brk=false});
function rnd(a){return a.sort(function(){return Math.random()-0.5})}
function spawn(){
  var d=dif();
  var opts=[sl-1,sl,sl+1].filter(function(v){return v>=0&&v<L});
  if(Math.random()<0.55+0.35*d)sl=opts[Math.floor(Math.random()*opts.length)];
  var oth=rnd([0,1,2].filter(function(v){return v!==sl}));
  var n=Math.random()<0.4+0.45*d?2:1;
  for(var i=0;i<n;i++)cars.push({l:oth[i],y:-CH,c:cols[Math.floor(Math.random()*cols.length)]});
  if(n===1&&Math.random()<0.25){pups.push({l:oth[1],y:-CH-10})}
  else if(Math.random()<0.5-0.2*d){coins.push({l:sl,y:-CH-30})}
  spawnD=124+(0.38-0.06*d)*speed*BM*CF+Math.random()*30
}
function hit(a,b){return Math.abs(a.x-b.x)<CW-6&&Math.abs(a.y-b.y)<CH-8}
function crash(py){
  st='crash';brk=false;brkPtr=null;submitFinalScore();
  if(score>best) {
    best=score;
    try { localStorage.setItem('trafficDodgerBest', String(Math.floor(best))); } catch (e) {}
  }
  tgHaptic('error');crashT=0.9;shake=0.5;flash=1;
  burst(p.x,py,['#ffffff','#ffd36b','#ff8a3d','#ff3b30'],50,280,0.9);upd()
}
function step(dt){
  var d=dif();
  speed=Math.min(520+d*220,speed+dt*(8+d*7));
  var eff=bT>0?speed*BM:(brk?speed*BRK:speed);
  curEff=eff;
  if(bT>0){bT-=dt;if(bT<0)bT=0}
  if(msg>0)msg-=dt;
  if(lvT>0)lvT-=dt;
  score+=dt*eff/18*(bT>0?2:1);
  var nl=1+Math.floor(score/LS);
  if(nl>lvl){lvl=nl;lvT=1.8;tgHaptic('success')}
  off=(off+eff*dt)%60;
  p.x+=(lx(p.l)-p.x)*Math.min(1,dt*14);
  spawnD-=eff*CF*dt;if(spawnD<=0)spawn();
  var py=H-CH/2-24,pr={x:p.x,y:py};
  for(var i=cars.length-1;i>=0;i--){
    var o=cars[i];o.y+=eff*CF*dt;
    if(hit({x:lx(o.l),y:o.y},pr)){crash(py);return}
    if(o.y>H+CH)cars.splice(i,1)
  }
  for(var j=coins.length-1;j>=0;j--){
    var k=coins[j];k.y+=eff*CF*dt;
    if(Math.abs(lx(k.l)-p.x)<28&&Math.abs(k.y-py)<44){cn++;score+=25;tgHaptic('selection');burst(lx(k.l),k.y,['#ffe28a','#ffc83a','#ffffff'],14,150,0.5);coins.splice(j,1);continue}
    if(k.y>H+20)coins.splice(j,1)
  }
  for(var m=pups.length-1;m>=0;m--){
    var u=pups[m];u.y+=eff*CF*dt;
    if(Math.abs(lx(u.l)-p.x)<28&&Math.abs(u.y-py)<44){if(bc<3)bc++;score+=15;tgHaptic('success');burst(lx(u.l),u.y,['#7ff0ff','#2d8cff','#ffffff'],18,170,0.6);pups.splice(m,1);continue}
    if(u.y>H+20)pups.splice(m,1)
  }
  upd()
}
function roadD(){
  var g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#12131c');g.addColorStop(0.5,'#1e2132');g.addColorStop(1,'#12131c');
  x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
  for(var i=0;i<specks.length;i++){var s=specks[i],yy=(s.y+off*0.9)%H;x.fillStyle='rgba(255,255,255,'+s.a+')';x.fillRect(s.x,yy,s.r,s.r*2)}
  x.fillStyle='#08090f';x.fillRect(-10,-10,16,H+20);x.fillRect(W-6,-10,16,H+20);
  x.save();x.shadowBlur=14;x.shadowColor='#00e5ff';x.fillStyle='#00e5ff';x.fillRect(5,0,2,H);
  x.shadowColor='#ff2fd1';x.fillStyle='#ff2fd1';x.fillRect(W-7,0,2,H);x.restore();
  x.fillStyle='rgba(255,255,255,0.5)';
  for(var l=1;l<L;l++){for(var y=-60+off;y<H;y+=60){x.beginPath();x.roundRect(l*LW-1.5,y,3,30,1.5);x.fill()}}
  for(var y2=-60+off;y2<H;y2+=60){x.fillStyle='rgba(0,229,255,0.9)';x.fillRect(1.5,y2+10,2.5,10);x.fillStyle='rgba(255,47,209,0.9)';x.fillRect(W-4,y2+10,2.5,10)}
  if(bT>0){x.fillStyle='rgba(180,230,255,0.3)';for(var s2=0;s2<16;s2++){var sx=12+((s2*53)%316),sy=((s2*97+off*14)%(H+120))-60;x.fillRect(sx,sy,1.5,50+(s2%3)*20)}}
}
function pill(px,py,w,h,txt,col){
  x.fillStyle='rgba(8,10,22,0.6)';x.beginPath();x.roundRect(px,py,w,h,h/2);x.fill();
  x.strokeStyle='rgba(255,255,255,0.14)';x.lineWidth=1;x.stroke();
  x.fillStyle=col||'#fff';x.textAlign='center';x.font='700 12px system-ui,sans-serif';x.fillText(txt,px+w/2,py+h/2+4)
}
function title(txt,yy,sz,c1,c2){
  x.textAlign='center';x.font='italic 800 '+sz+'px system-ui,sans-serif';
  var g=x.createLinearGradient(50,0,W-50,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  x.save();x.shadowColor=c1;x.shadowBlur=20;x.fillStyle=g;x.fillText(txt,W/2,yy);x.restore()
}
function cta(txt,yy){
  var a=0.75+Math.sin(clock*4)*0.25,g=x.createLinearGradient(W/2-90,0,W/2+90,0);g.addColorStop(0,'#00c8ff');g.addColorStop(1,'#ff2fd1');
  x.save();x.globalAlpha=a;x.shadowColor='#00e5ff';x.shadowBlur=18;x.fillStyle=g;x.beginPath();x.roundRect(W/2-90,yy,180,46,23);x.fill();x.restore();
  x.fillStyle='#fff';x.textAlign='center';x.font='800 16px system-ui,sans-serif';x.fillText(txt,W/2,yy+29)
}
function draw(){
  x.clearRect(0,0,W,H);
  x.save();
  var sm=shake>0?shake*16:(bT>0&&st==='play'?1:0);
  if(sm>0)x.translate((Math.random()-0.5)*sm,(Math.random()-0.5)*sm);
  roadD();
  for(var i=0;i<coins.length;i++)coinD(coins[i]);
  for(var m=0;m<pups.length;m++)pupD(pups[m]);
  for(var j=0;j<cars.length;j++){var o=cars[j];car(lx(o.l),o.y,o.c,false)}
  if(p&&(st==='play'||st==='ready'))car(p.x,H-CH/2-24,'#2FD8FF',true);
  x.save();x.globalCompositeOperation='lighter';
  for(var q=0;q<parts.length;q++){var pt=parts[q];x.globalAlpha=Math.max(0,pt.l/pt.m);x.fillStyle=pt.c;x.beginPath();x.arc(pt.x,pt.y,pt.s,0,7);x.fill()}
  x.restore();
  x.restore();
  x.fillStyle=vig;x.fillRect(0,0,W,H);
  if(bT>0&&st==='play'){x.save();x.globalAlpha=Math.min(1,bT*2.5);x.fillStyle=vigB;x.fillRect(0,0,W,H);x.restore()}
  if(flash>0){x.fillStyle='rgba(255,255,255,'+(flash*0.55)+')';x.fillRect(0,0,W,H)}
  if(st==='play'){
    pill(10,10,78,24,'LEVEL '+lvl,'#ffd36b');
    pill(W-98,10,88,24,Math.round(curEff*0.5)+' km/h','#7ff0ff');
    if(bT>0){x.fillStyle='rgba(0,0,0,0.45)';x.beginPath();x.roundRect(W/2-60,44,120,8,4);x.fill();x.save();x.shadowColor='#00e5ff';x.shadowBlur=10;x.fillStyle='#7ff0ff';x.beginPath();x.roundRect(W/2-60,44,120*bT/BD,8,4);x.fill();x.restore();x.textAlign='center';x.font='800 12px system-ui,sans-serif';x.fillStyle='#fff';x.fillText('BOOST  x2 POINTS',W/2,66)}
    else if(brk){x.textAlign='center';x.font='800 13px system-ui,sans-serif';x.fillStyle='#ff7468';x.fillText('BRAKING',W/2,56)}
    if(lvT>0){x.save();x.globalAlpha=Math.min(1,lvT);title('LEVEL '+lvl,H/2-70,34,'#ffd36b','#ff8a3d');x.textAlign='center';x.font='600 14px system-ui,sans-serif';x.fillStyle='#fff';x.fillText('Traffic gets faster',W/2,H/2-44);x.restore()}
    if(msg>0){x.textAlign='center';x.font='700 15px system-ui,sans-serif';x.fillStyle='#fff';x.fillText('No boost left. Collect a bolt.',W/2,H/2+20)}
  }
  if(st==='ready'||st==='over'){
    x.fillStyle='rgba(6,8,20,0.74)';x.fillRect(0,0,W,H);
    if(st==='ready'){
      title('TRAFFIC',140,44,'#00e5ff','#7a7bff');title('DODGER',186,44,'#ff2fd1','#ff8a3d');
      x.textAlign='center';x.font='500 14px system-ui,sans-serif';x.fillStyle='#b8bfd6';
      x.fillText('Tap left or right to switch lanes',W/2,230);
      x.fillText('Hold Brake to slow down',W/2,252);
      x.fillText('Collect bolts, then press Boost',W/2,274);
      x.fillText('The farther you go, the harder it gets',W/2,296);
      cta('TAP TO START',330)
    } else {
      title('CRASHED',130,40,'#ff5a4d','#ff2fd1');
      x.textAlign='center';x.fillStyle='#8d93b5';x.font='600 12px system-ui,sans-serif';x.fillText('SCORE',W/2,170);
      x.fillStyle='#fff';x.font='800 46px system-ui,sans-serif';x.fillText(Math.floor(score),W/2,214);
      if(score>0&&score>=best){x.fillStyle='#ffd36b';x.font='800 13px system-ui,sans-serif';x.fillText('NEW BEST',W/2,238)}
      x.fillStyle='#b8bfd6';x.font='600 14px system-ui,sans-serif';x.fillText('Level '+lvl+'   ·   Coins '+cn+'   ·   Best '+Math.floor(best),W/2,266);
      cta('PLAY AGAIN',300)
    }
  }
}
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000||0);last=t;clock+=dt;
  if(st==='play')step(dt);
  else if(st==='crash'){crashT-=dt;if(crashT<=0)st='over'}
  upParts(dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*2.5);
  draw();requestAnimationFrame(loop)
}
reset();last=performance.now();requestAnimationFrame(loop)
})();
</script>
